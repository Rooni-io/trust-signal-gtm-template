homepage: "https://rooni.io"
documentation: "https://github.com/Rooni-io/trust-signal-gtm-template#readme"
versions:
  # Newest version first. Replace the sha below with the commit SHA of the
  # GitHub commit that contains this template.tpl, then push again.
  - sha: "0856c100337ac210efe2490684dab47377192dfa"
    changeNotes: |-
      Version 3
      - Replaced the crowded default table with seven always-visible global consent defaults.
      - Added an optional regional override table, hidden unless explicitly enabled.
      - Website ID now remains the normal source for published framework and geographic rules.
      - Regional override rows apply before the global fallback using Google's consent precedence.
      - Updated template tests for global defaults, regional overrides, and automatic website configuration.
  - sha: "ed09c7ded10c02733eada12a42474c8ef5d8b1a9"
    changeNotes: |-
      Version 2
      - Consent updates now use the Tag Manager updateConsentState API instead of gtag consent commands.
      - Returning visitors' saved choices are applied synchronously on Consent Initialization.
      - Region-specific default consent settings (ISO 3166-2) with a global fallback.
      - Added personalization_storage and security_storage to managed consent types.
      - Configurable wait_for_update (milliseconds).
      - Optional ads_data_redaction and url_passthrough settings.
      - Expanded template tests.
  - sha: "15442cf4a6f674c6dadbe6458a0222bcc158eed6"
    changeNotes: |-
      Version 1
      - Initial release of the Trust Signal consent banner template.
      - Google Consent Mode v2 defaults with configurable wait_for_update.
      - Website ID format validation, custom script origin support, and template tests.
